<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Improv Wi-Fi provisioning</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      section {
        margin: 2rem 0;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #222;
          color: #eee;
        }
        a {
          color: #58a6ff;
        }
      }
    </style>
    <script>
      // Both clients bundle the same @material/web components; let the one
      // loaded second reuse the definitions instead of throwing.
      const define = customElements.define.bind(customElements);
      customElements.define = (name, ctor, opts) =>
        customElements.get(name) ? undefined : define(name, ctor, opts);
    </script>
    <script type="module" src="./ble/launch-button.js"></script>
    <script type="module" src="./serial/serial-launch-button.js"></script>
  </head>
  <body>
    <h1>Improv Wi-Fi provisioning</h1>
    <p>
      Configure Wi-Fi on a device running the
      <a href="https://github.com/mhaberler/Improv-WiFi-Library">Improv-WiFi-Library</a>.
      Requires Chrome or Edge (Web Bluetooth / Web Serial).
    </p>

    <section>
      <h2>Bluetooth</h2>
      <improv-wifi-launch-button></improv-wifi-launch-button>
      <p>
        On iOS, open this page in the
        <a href="https://apps.apple.com/app/bluefy-web-ble-browser/id1492822055">Bluefy</a>
        browser.
      </p>
    </section>

    <section>
      <h2>USB serial</h2>
      <improv-wifi-serial-launch-button></improv-wifi-serial-launch-button>
    </section>

    <footer>
      <small>
        Clients:
        <a href="https://github.com/mhaberler/sdk-ble-js/tree/fix/rpc-write-await">sdk-ble-js</a>
        (patched),
        <a href="https://github.com/improv-wifi/sdk-serial-js">sdk-serial-js</a>.
        Apache-2.0, see <a href="LICENSE">LICENSE</a>.
      </small>
    </footer>
  </body>
</html>
