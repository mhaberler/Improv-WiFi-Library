; Heap / flash footprint of the Improv transports and of ImprovWiFiBLE::end().
; Results are in the top-level README ("Memory footprint").
;
;   pio run -e c6-ble -t upload && pio device monitor
;
; Each sketch prints "PHASE ..." / "HEAP ..." lines on the USB serial port.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../..
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- boards ---
[c6]
board = esp32-c6-devkitm-1  ; M5Stack NanoC6
board_build.mcu = esp32c6
board_build.partitions = ota_nofs_4MB.csv
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1

[s3]
board = m5stack-stamps3
build_flags = ${env.build_flags}

; --- variants ---
; footprint.cpp: idle heap with Wi-Fi + selected transports
[baseline]
build_src_filter = -<*> +<footprint.cpp>
flags =
[serial]
build_src_filter = -<*> +<footprint.cpp>
flags = -DUSE_SERIAL
[ble]
build_src_filter = -<*> +<footprint.cpp>
flags = -DUSE_BLE -DIMPROV_WIFI_BLE_ENABLED
[both]
build_src_filter = -<*> +<footprint.cpp>
flags = -DUSE_SERIAL -DUSE_BLE -DIMPROV_WIFI_BLE_ENABLED
; linked.cpp: BLE stack linked, never started
[linked]
build_src_filter = -<*> +<linked.cpp>
flags = -DIMPROV_WIFI_BLE_ENABLED
; scan.cpp: app runs a BLE scan, then Improv is started on top
[scan]
build_src_filter = -<*> +<scan.cpp>
flags = -DIMPROV_WIFI_BLE_ENABLED
; end_test.cpp: start/end() cycles, then restart (BLE left advertising)
[cycle]
build_src_filter = -<*> +<end_test.cpp>
flags = -DIMPROV_WIFI_BLE_ENABLED -DCYCLES=5
; end_test.cpp: start, end(true)
[release]
build_src_filter = -<*> +<end_test.cpp>
flags = -DIMPROV_WIFI_BLE_ENABLED -DCYCLES=1 -DRELEASE_MEMORY

[env:c6-baseline]
extends = c6
build_src_filter = ${baseline.build_src_filter}
build_flags = ${c6.build_flags} ${baseline.flags}

[env:c6-serial]
extends = c6
build_src_filter = ${serial.build_src_filter}
build_flags = ${c6.build_flags} ${serial.flags}

[env:c6-ble]
extends = c6
build_src_filter = ${ble.build_src_filter}
build_flags = ${c6.build_flags} ${ble.flags}

[env:c6-both]
extends = c6
build_src_filter = ${both.build_src_filter}
build_flags = ${c6.build_flags} ${both.flags}

[env:c6-linked]
extends = c6
build_src_filter = ${linked.build_src_filter}
build_flags = ${c6.build_flags} ${linked.flags}

[env:c6-cycle]
extends = c6
build_src_filter = ${cycle.build_src_filter}
build_flags = ${c6.build_flags} ${cycle.flags}

[env:c6-release]
extends = c6
build_src_filter = ${release.build_src_filter}
build_flags = ${c6.build_flags} ${release.flags}

[env:s3-baseline]
extends = s3
build_src_filter = ${baseline.build_src_filter}
build_flags = ${s3.build_flags} ${baseline.flags}

[env:s3-serial]
extends = s3
build_src_filter = ${serial.build_src_filter}
build_flags = ${s3.build_flags} ${serial.flags}

[env:s3-ble]
extends = s3
build_src_filter = ${ble.build_src_filter}
build_flags = ${s3.build_flags} ${ble.flags}

[env:s3-both]
extends = s3
build_src_filter = ${both.build_src_filter}
build_flags = ${s3.build_flags} ${both.flags}

[env:s3-linked]
extends = s3
build_src_filter = ${linked.build_src_filter}
build_flags = ${s3.build_flags} ${linked.flags}

[env:s3-cycle]
extends = s3
build_src_filter = ${cycle.build_src_filter}
build_flags = ${s3.build_flags} ${cycle.flags}

[env:s3-release]
extends = s3
build_src_filter = ${release.build_src_filter}
build_flags = ${s3.build_flags} ${release.flags}

[env:c6-scan]
extends = c6
build_src_filter = ${scan.build_src_filter}
build_flags = ${c6.build_flags} ${scan.flags}

[env:s3-scan]
extends = s3
build_src_filter = ${scan.build_src_filter}
build_flags = ${s3.build_flags} ${scan.flags}

; --- Arduino-ESP32 4.0 RC1 (pioarduino 61.04.00-RC1) ---
[v4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
build_src_filter = -<*> +<scan_v4.cpp>

[env:s3-scan-v4]
extends = s3
platform = ${v4.platform}
build_src_filter = ${v4.build_src_filter}
build_flags = ${s3.build_flags} -DIMPROV_WIFI_BLE_ENABLED

[env:s3-extscan-v4]
extends = s3
platform = ${v4.platform}
build_src_filter = ${v4.build_src_filter}
build_flags = ${s3.build_flags} -DIMPROV_WIFI_BLE_ENABLED -DEXT_SCAN

[env:c6-scan-v4]
extends = c6
platform = ${v4.platform}
build_src_filter = ${v4.build_src_filter}
build_flags = ${c6.build_flags} -DIMPROV_WIFI_BLE_ENABLED

[env:c6-extscan-v4]
extends = c6
platform = ${v4.platform}
build_src_filter = ${v4.build_src_filter}
build_flags = ${c6.build_flags} -DIMPROV_WIFI_BLE_ENABLED -DEXT_SCAN

; stop_test.cpp: Improv-only stop() next to a running scan
[env:c6-stop]
extends = c6
build_src_filter = -<*> +<stop_test.cpp>
build_flags = ${c6.build_flags} -DIMPROV_WIFI_BLE_ENABLED

[env:s3-stop]
extends = s3
build_src_filter = -<*> +<stop_test.cpp>
build_flags = ${s3.build_flags} -DIMPROV_WIFI_BLE_ENABLED

[env:c6-stop-v4]
extends = c6
platform = ${v4.platform}
build_src_filter = -<*> +<stop_test.cpp>
build_flags = ${c6.build_flags} -DIMPROV_WIFI_BLE_ENABLED

[env:s3-stop-v4]
extends = s3
platform = ${v4.platform}
build_src_filter = -<*> +<stop_test.cpp>
build_flags = ${s3.build_flags} -DIMPROV_WIFI_BLE_ENABLED
